<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detection Website</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .container{
            width:450px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        p{
            color:gray;
            margin-bottom:25px;
            font-size:14px;
        }

        textarea{
            width:100%;
            height:140px;
            padding:15px;
            border:2px solid #ddd;
            border-radius:10px;
            resize:none;
            font-size:16px;
            outline:none;
            transition:0.3s;
        }

        textarea:focus{
            border-color:#4facfe;
            box-shadow:0 0 10px rgba(79,172,254,0.5);
        }

        button{
            width:100%;
            padding:15px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#4facfe;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0099ff;
            transform:scale(1.03);
        }

        .result{
            margin-top:25px;
            padding:15px;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
            background:#f4f4f4;
            color:green;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Spam Detection System</h1>

        <p>Enter a message below to check whether it is Spam or Not Spam.</p>

        <form action="/predict" method="POST">

            <textarea 
                name="message" 
                placeholder="Type your message here..."
                required>
            </textarea>

            <button type="submit">
                Check Message
            </button>

        </form>

        {% if prediction %}
            <div class="result">
                {{ prediction }}
            </div>
        {% endif %}

    </div>

</body>
</html>
